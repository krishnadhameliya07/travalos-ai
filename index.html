<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAVALOS — Generic Agentic Travel OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            twilight: { 950: '#0D0F18', 900: '#141724', 850: '#1A1E2F', 800: '#22273D', text: '#141724', muted: '#616982' },
            harborTeal: { DEFAULT: '#3FA7A7', hover: '#338E8E', dark: '#246D6D' },
            sunsetCoral: { DEFAULT: '#EA5455', hover: '#D84344', dark: '#B7292A' },
            goldenSun: { DEFAULT: '#F7D05C', dark: '#9C7A14' },
            mauveDusk: { DEFAULT: '#8F5B8F', dark: '#5D355D' },
            mist: { DEFAULT: '#BDC3D7', canvas: '#F5F6FA', card: '#FFFFFF', border: '#D8DCE8', borderLight: '#E8EBF2' }
          },
          fontFamily: { sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'], mono: ['SF Mono', 'monospace'] }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background-color: #141724; color: #141724; -webkit-font-smoothing: antialiased; }
    .waterfront-glow { background: radial-gradient(circle at 50% -20%, rgba(234, 84, 85, 0.24) 0%, rgba(143, 91, 143, 0.22) 30%, rgba(63, 167, 167, 0.18) 60%, transparent 85%), #141724; }
    .radar-sweep { animation: radarSpin 4s linear infinite; }
    @keyframes radarSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="selection:bg-sunsetCoral selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE_URL = window.location.origin.includes(":3000") ? "http://localhost:8000" : window.location.origin;

    function App() {
      // Finite State Machine: 'landing' | 'clarification' | 'processing' | 'dashboard' | 'confirmed'
      const [step, setStep] = useState('landing');
      const [backendOnline, setBackendOnline] = useState(false);
      const [conversationId, setConversationId] = useState("conv_" + Date.now());
      const [missionInput, setMissionInput] = useState("");
      
      const [clarificationQuestion, setClarificationQuestion] = useState("");
      const [clarificationAnswer, setClarificationAnswer] = useState("");

      const [mission, setMission] = useState(null);
      const [recommendedPlan, setRecommendedPlan] = useState(null);
      const [activePlan, setActivePlan] = useState(null);
      const [alternativePlans, setAlternativePlans] = useState([]);
      const [rejectedPlans, setRejectedPlans] = useState([]);
      const [whyThisPlan, setWhyThisPlan] = useState("");
      const [whyNotCheapest, setWhyNotCheapest] = useState("");

      const [showWhyModal, setShowWhyModal] = useState(false);
      const [showWhyNotCheapestModal, setShowWhyNotCheapestModal] = useState(false);
      const [showReplanDrawer, setShowReplanDrawer] = useState(false);
      const [showConfirmModal, setShowConfirmModal] = useState(false);
      const [replanningEffect, setReplanningEffect] = useState(false);

      useEffect(() => {
        fetch(`${API_BASE_URL}/health`)
          .then(res => res.json())
          .then(data => setBackendOnline(data.status === "healthy"))
          .catch(() => setBackendOnline(false));
      }, []);

      // Complete Workspace Reset
      const handleNewTrip = () => {
        setMissionInput("");
        setMission(null);
        setActivePlan(null);
        setRecommendedPlan(null);
        setAlternativePlans([]);
        setRejectedPlans([]);
        setWhyThisPlan("");
        setWhyNotCheapest("");
        setConversationId("conv_" + Date.now());
        setStep('landing');
      };

      const sendPlanRequest = async (text) => {
        if (!text.trim()) return;
        setStep('processing');
        try {
          const res = await fetch(`${API_BASE_URL}/api/plan-trip`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, conversation_id: conversationId })
          });
          const data = await res.json();

          if (data.status === "CLARIFICATION_NEEDED") {
            setClarificationQuestion(data.clarification_question);
            setStep('clarification');
            return;
          }

          setMission(data.mission);
          setRecommendedPlan(data.recommended_plan);
          setActivePlan(data.recommended_plan);
          setAlternativePlans(data.alternative_plans || []);
          setRejectedPlans(data.rejected_plans || []);
          setWhyThisPlan(data.why_this_plan);
          setWhyNotCheapest(data.why_not_cheapest);
          setStep('dashboard');
        } catch (err) {
          alert("Could not reach backend at " + API_BASE_URL);
          setStep('landing');
        }
      };

      const handleClarificationSubmit = () => {
        if (!clarificationAnswer.trim()) return;
        const combined = missionInput + ". " + clarificationAnswer;
        setMissionInput(combined);
        setClarificationAnswer("");
        sendPlanRequest(combined);
      };

      const executeReplan = async (newBudget, newDeadlineMin, newDeadlineStr, newStyle) => {
        setShowReplanDrawer(false);
        setReplanningEffect(true);
        try {
          const res = await fetch(`${API_BASE_URL}/api/replan`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              conversation_id: conversationId,
              new_budget: newBudget,
              new_deadline_minutes: newDeadlineMin,
              new_deadline_str: newDeadlineStr,
              new_optimization_mode: newStyle.toLowerCase()
            })
          });
          const data = await res.json();
          setMission(data.mission);
          setRecommendedPlan(data.recommended_plan);
          setActivePlan(data.recommended_plan);
          setAlternativePlans(data.alternative_plans || []);
          setRejectedPlans(data.rejected_plans || []);
          setWhyThisPlan(data.why_this_plan);
          setWhyNotCheapest(data.why_not_cheapest);
          setReplanningEffect(false);
        } catch (e) {
          setReplanningEffect(false);
        }
      };

      const handleConfirmAction = async () => {
        setShowConfirmModal(false);
        try {
          await fetch(`${API_BASE_URL}/api/confirm`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              plan_id: activePlan.id,
              conversation_id: conversationId,
              authorized_cost: activePlan.total_cost
            })
          });
        } catch (e) {}
        // Transitions directly to terminal confirmed state (breaks infinite loop)
        setStep('confirmed');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between font-sans">
          
          {/* HEADER */}
          <header className="border-b border-white/10 bg-twilight-950/85 sticky top-0 z-40 backdrop-blur-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-18 py-3.5 flex items-center justify-between">
              <div onClick={handleNewTrip} className="flex items-center gap-3 cursor-pointer group">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-sunsetCoral via-mauveDusk to-twilight-950 flex items-center justify-center border border-white/15 shadow-lg group-hover:scale-105 transition">
                  <span className="font-extrabold text-white text-lg">T</span>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-white text-lg">TRAVALOS</span>
                    <span className="text-[10px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-mauveDusk/30 text-goldenSun border border-mauveDusk/50">GENERIC OS</span>
                  </div>
                  <p className="text-[10px] text-mist font-medium -mt-1">Destination-Agnostic Travel Engine</p>
                </div>
              </div>

              <div className="flex items-center gap-3.5">
                <div className="flex items-center gap-2 text-xs font-semibold text-white bg-white/5 border border-white/10 rounded-full px-3.5 py-1.5">
                  <span className={`w-2 h-2 rounded-full ${backendOnline ? 'bg-harborTeal' : 'bg-sunsetCoral'}`}></span>
                  <span>{backendOnline ? 'Engine Online' : 'Offline'}</span>
                </div>
                {(step === 'dashboard' || step === 'confirmed') && (
                  <button onClick={handleNewTrip} className="text-xs font-bold px-4 py-2 rounded-xl bg-sunsetCoral hover:bg-sunsetCoral-hover text-white transition shadow-sm">
                    + New Trip
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* VIEWPORT */}
          <main className="flex-1 w-full">
            
            {/* VIEW 1: LANDING */}
            {step === 'landing' && (
              <div className="min-h-[calc(100vh-140px)] flex flex-col justify-center items-center relative overflow-hidden py-16 px-4 waterfront-glow">
                <div className="max-w-3xl w-full mx-auto relative z-10 text-center space-y-7">
                  <div className="space-y-3">
                    <h1 className="text-4xl sm:text-5xl font-extrabold text-white tracking-tight leading-[1.2]">
                      Tell us where you're going.<br />
                      <span className="bg-gradient-to-r from-goldenSun via-sunsetCoral to-harborTeal bg-clip-text text-transparent">We'll figure out the journey.</span>
                    </h1>
                    <p className="text-base text-mist max-w-xl mx-auto leading-relaxed">
                      Flights, stays and local transport — coordinated around your time, budget and preferences in one continuous plan.
                    </p>
                  </div>

                  <div className="bg-twilight-900/90 rounded-3xl p-6 border border-white/15 shadow-2xl backdrop-blur-xl text-left relative">
                    <div className="flex items-center justify-between text-xs text-mist mb-2.5">
                      <span className="font-extrabold uppercase tracking-wider text-goldenSun">● TRAVEL MISSION COMPOSER</span>
                      <span className="text-mist/70 text-[11px] font-mono">ANY INDIAN DESTINATION</span>
                    </div>

                    <textarea
                      rows={3}
                      value={missionInput}
                      onChange={(e) => setMissionInput(e.target.value)}
                      placeholder="e.g. 'I’m travelling from Bengaluru to Dharamshala with my parents for 5 days in December. Keep under ₹45,000, prefer flights and avoid too many transfers...'"
                      className="w-full bg-twilight-950/85 text-white placeholder-mist/40 text-sm sm:text-base rounded-2xl p-4 border border-white/10 focus:border-harborTeal outline-none transition resize-none"
                    />

                    <div className="mt-4 pt-3 border-t border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div className="text-xs text-mist font-mono">Data Source: <strong className="text-white">Simulated Benchmark Feeds</strong></div>
                      <button onClick={() => sendPlanRequest(missionInput)} className="px-7 py-3 rounded-xl bg-sunsetCoral hover:bg-sunsetCoral-hover text-white font-extrabold text-xs uppercase tracking-wider transition flex items-center justify-center gap-2">
                        <span>Plan My Trip</span>
                        <span>→</span>
                      </button>
                    </div>
                  </div>

                  {/* Stress-Test Prompts */}
                  <div className="pt-2 flex flex-wrap items-center justify-center gap-2 text-xs">
                    <span className="text-mist/70 font-semibold mr-1">Try stress-tests:</span>
                    <button onClick={() => setMissionInput("I’m travelling from Bengaluru to Dharamshala with my parents for 5 days in December. We are 3 people. We want to keep the total trip under ₹45,000, prefer flights for the long-distance portion but want to avoid too many transfers. We need a comfortable hotel, and we would like to reach Dharamshala before 5 PM on the first day. Include the return journey and show me the most practical complete route.")} className="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white transition">
                      🏔️ Bengaluru → Dharamshala (3 Pax, Dec)
                    </button>
                    <button onClick={() => setMissionInput("I want to travel from Bangalore to Shimla for 4 days with two friends next month. We prefer trains, but use a flight if necessary. Find a comfortable hotel near Mall Road and include the return journey.")} className="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white transition">
                      🌲 Bangalore → Shimla (Mall Road, 3 Pax)
                    </button>
                    <button onClick={() => setMissionInput("I need to travel alone from Hyderabad to Jaipur on 18 October. One-way only. No hotel. Budget ₹8,000. Fastest practical option.")} className="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white transition">
                      ⚡ Hyderabad → Jaipur (One-Way Solo)
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: CLARIFICATION */}
            {step === 'clarification' && (
              <div className="max-w-md mx-auto py-24 px-4">
                <div className="bg-twilight-900 rounded-3xl p-8 shadow-2xl border border-white/15 space-y-5 text-white">
                  <div className="text-xs font-bold uppercase tracking-wider text-sunsetCoral">Clarification Needed</div>
                  <h3 className="text-xl font-extrabold leading-snug">{clarificationQuestion}</h3>
                  <input
                    type="text"
                    autoFocus
                    value={clarificationAnswer}
                    onChange={(e) => setClarificationAnswer(e.target.value)}
                    placeholder="e.g. '12th to 16th December'..."
                    className="w-full bg-twilight-950 border border-white/15 p-4 rounded-xl text-white text-sm outline-none focus:border-harborTeal"
                    onKeyDown={(e) => e.key === 'Enter' && handleClarificationSubmit()}
                  />
                  <div className="flex justify-end gap-3 pt-2">
                    <button onClick={handleNewTrip} className="px-4 py-2 text-xs font-semibold text-mist hover:text-white">Start Over</button>
                    <button onClick={handleClarificationSubmit} className="px-6 py-2.5 rounded-xl bg-sunsetCoral text-white text-xs font-bold">Continue Planning →</button>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: PROCESSING */}
            {step === 'processing' && (
              <div className="max-w-md mx-auto py-32 px-4 text-center space-y-6">
                <div className="relative w-32 h-32 mx-auto rounded-full border border-harborTeal/30 bg-twilight-950/80 overflow-hidden flex items-center justify-center shadow-2xl">
                  <div className="absolute inset-0 radar-sweep" style={{ background: 'conic-gradient(from 0deg, transparent 70%, rgba(63, 167, 167, 0.4) 100%)' }}></div>
                  <span className="relative z-10 text-goldenSun font-mono text-xl">✈</span>
                </div>
                <div className="space-y-1">
                  <h2 className="text-xl font-black text-white">Synthesizing Multimodal Path...</h2>
                  <p className="text-xs text-harborTeal font-mono">Running topological validator & infrastructure check</p>
                </div>
              </div>
            )}

            {/* VIEW 4: DASHBOARD RESULTS */}
            {step === 'dashboard' && mission && activePlan && (
              <div className="bg-mist-canvas min-h-screen text-twilight-text pb-24">
                
                {/* DYNAMIC MISSION BAR */}
                <div className="bg-twilight-950 border-b border-twilight-850 text-white py-6 px-4 sm:px-6">
                  <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <div className="text-[10px] font-extrabold uppercase tracking-widest text-sunsetCoral">
                        MISSION • {mission.trip_type.replace('_', ' ').toUpperCase()} ({mission.travelers.total_count} {mission.travelers.total_count > 1 ? 'travellers' : 'traveller'})
                      </div>
                      <h2 className="text-2xl font-black tracking-tight flex items-center gap-2 mt-0.5">
                        <span>{mission.origin}</span>
                        <span className="text-harborTeal">→</span>
                        <span className="underline decoration-goldenSun decoration-2">{mission.destination}</span>
                      </h2>
                    </div>

                    <div className="flex flex-wrap items-center gap-2 text-xs">
                      <span className="bg-white/10 text-white px-3 py-1.5 rounded-lg border border-white/10 font-medium">
                        📅 {mission.dates.display_label}
                      </span>
                      {mission.has_deadline && (
                        <span className="bg-sunsetCoral/20 text-sunsetCoral-light px-3 py-1.5 rounded-lg border border-sunsetCoral/30 font-bold">
                          ⏰ By {mission.arrival_deadline}
                        </span>
                      )}
                      {mission.has_budget && (
                        <span className="bg-harborTeal/20 text-harborTeal-light px-3 py-1.5 rounded-lg border border-harborTeal/30 font-bold">
                          💰 Budget ₹{mission.max_budget.toLocaleString()}
                        </span>
                      )}
                      <button onClick={() => setShowReplanDrawer(true)} className="bg-sunsetCoral hover:bg-sunsetCoral-hover text-white px-4 py-1.5 rounded-lg font-bold transition shadow-sm">
                        Modify Trip
                      </button>
                    </div>
                  </div>
                </div>

                {/* WORKSPACE */}
                <div className="max-w-7xl mx-auto px-4 sm:px-6 pt-8 space-y-8">
                  {replanningEffect && (
                    <div className="p-4 bg-sunsetCoral/10 border border-sunsetCoral/20 rounded-2xl text-xs text-sunsetCoral-dark font-bold">
                      ⚡ Updating route parameters and re-ranking viable combinations...
                    </div>
                  )}

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                    
                    {/* LEFT: HERO ITINERARY */}
                    <div className="lg:col-span-7 space-y-6">
                      <div className="bg-white rounded-3xl p-8 border border-mist-border shadow-sm space-y-6">
                        
                        <div className="flex flex-col sm:flex-row sm:items-start justify-between pb-6 border-b border-mist-borderLight gap-4">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="px-3 py-1 rounded-md text-[11px] font-black uppercase tracking-wider bg-harborTeal text-white">
                                {activePlan.badge}
                              </span>
                              <span className="text-xs text-twilight-muted font-bold">{activePlan.title}</span>
                            </div>
                            <div className="mt-3 flex items-baseline gap-2">
                              <span className="text-4xl font-black text-twilight-950">₹{activePlan.total_cost.toLocaleString()}</span>
                              <span className="text-xs text-twilight-muted font-semibold">total door-to-door cost</span>
                            </div>
                            {mission.has_budget && (
                              <div className="text-xs text-harborTeal-dark font-bold mt-1">
                                ₹{(mission.max_budget - activePlan.total_cost).toLocaleString()} remaining from budget
                              </div>
                            )}
                          </div>

                          <div className="grid grid-cols-2 gap-2 text-right">
                            {activePlan.destination_arrival_time && (
                              <div className="bg-mist-canvas p-3 rounded-xl border border-mist-border text-right">
                                <div className="text-[10px] uppercase font-bold text-twilight-muted">Destination Reached</div>
                                <div className="text-sm font-extrabold text-twilight-950">{activePlan.destination_arrival_time}</div>
                              </div>
                            )}
                            <div className="bg-mist-canvas p-3 rounded-xl border border-mist-border text-right">
                              <div className="text-[10px] uppercase font-bold text-twilight-muted">Fidelity Check</div>
                              <div className="text-sm font-extrabold text-harborTeal-dark">✓ {activePlan.final_destination}</div>
                            </div>
                          </div>
                        </div>

                        {/* STAGE TIMELINE */}
                        <div className="space-y-4">
                          <div className="text-xs font-extrabold uppercase tracking-wider text-twilight-muted">
                            Complete Connected Itinerary ({activePlan.legs.length} stages)
                          </div>

                          <div className="relative border-l-2 border-mist-border ml-4 pl-6 space-y-5">
                            {activePlan.legs.map((leg, idx) => (
                              <div key={idx} className="relative">
                                <div className={`absolute -left-[33px] top-2 w-4 h-4 rounded-full bg-white border-4 ${
                                  leg.category === 'hotel' ? 'border-goldenSun' : leg.stage.includes('gateway') ? 'border-mauveDusk' : 'border-harborTeal'
                                }`}></div>

                                <div className="bg-mist-canvas p-4 rounded-2xl border border-mist-border flex items-center justify-between gap-4">
                                  <div>
                                    <div className="font-extrabold text-xs text-twilight-950">{leg.title}</div>
                                    <div className="text-[11px] text-twilight-muted">
                                      {leg.origin_name} → {leg.destination_name} {leg.departure_time && `(${leg.departure_time})`}
                                    </div>
                                    <div className="text-[10px] text-twilight-muted/80 font-mono mt-0.5">
                                      Formula: {leg.cost_math.multiplier_formula}
                                    </div>
                                  </div>
                                  <div className="text-right font-mono font-bold text-sm text-twilight-950">
                                    ₹{leg.cost.toLocaleString()}
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* REASONING ACCORDIONS */}
                        <div className="pt-4 border-t border-mist-borderLight flex gap-3">
                          <button onClick={() => { setShowWhyModal(!showWhyModal); setShowWhyNotCheapestModal(false); }} className="flex-1 py-2.5 rounded-xl bg-mist-canvas hover:bg-mist-border text-xs font-bold border border-mist-border transition">
                            Why this plan?
                          </button>
                          <button onClick={() => { setShowWhyNotCheapestModal(!showWhyNotCheapestModal); setShowWhyModal(false); }} className="flex-1 py-2.5 rounded-xl bg-mist-canvas hover:bg-mist-border text-xs font-bold border border-mist-border transition">
                            Why not cheapest?
                          </button>
                        </div>

                        {showWhyModal && (
                          <div className="p-4 bg-harborTeal/10 border border-harborTeal/20 rounded-2xl text-xs space-y-2">
                            <strong className="text-harborTeal-dark block font-bold">Why Travalos Selected This:</strong>
                            <p className="text-twilight-text leading-relaxed">{whyThisPlan}</p>
                          </div>
                        )}

                        {showWhyNotCheapestModal && (
                          <div className="p-4 bg-goldenSun/15 border border-goldenSun/30 rounded-2xl text-xs space-y-2">
                            <strong className="text-goldenSun-dark block font-bold">Tradeoff Analysis:</strong>
                            <p className="text-twilight-text leading-relaxed">{whyNotCheapest}</p>
                          </div>
                        )}

                        {/* APPROVE CTA */}
                        <div className="pt-4 border-t border-mist-borderLight flex items-center justify-between">
                          <div className="text-xs text-twilight-muted">Data Source: Verified Multimodal Benchmarks</div>
                          <button onClick={() => setShowConfirmModal(true)} className="px-7 py-3 rounded-xl bg-sunsetCoral hover:bg-sunsetCoral-hover text-white font-extrabold text-xs shadow-md transition">
                            Approve Trip Plan →
                          </button>
                        </div>
                      </div>

                      {/* ALTERNATIVES */}
                      {alternativePlans.length > 0 && (
                        <div className="space-y-3">
                          <h4 className="text-xs font-extrabold uppercase tracking-wider text-twilight-muted">Other Feasible Multimodal Combinations</h4>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            {alternativePlans.map((alt) => (
                              <div key={alt.id} onClick={() => setActivePlan(alt)} className="bg-white p-5 rounded-2xl border border-mist-border cursor-pointer hover:border-harborTeal transition shadow-sm space-y-2">
                                <div className="flex justify-between items-center text-xs">
                                  <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-mist-borderLight">{alt.badge}</span>
                                  <span className="font-mono font-bold">₹{alt.total_cost.toLocaleString()}</span>
                                </div>
                                <div className="text-xs font-bold text-twilight-950">{alt.title}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    {/* RIGHT: REQUIREMENTS CHECK & WHAT-IF */}
                    <div className="lg:col-span-5 space-y-6">
                      
                      {/* REQUIREMENTS CHECK */}
                      <div className="bg-white rounded-3xl p-6 border border-mist-border shadow-sm space-y-3">
                        <div className="flex justify-between items-center pb-2 border-b border-mist-borderLight">
                          <span className="text-xs font-extrabold uppercase tracking-wider text-twilight-muted">Requirements Check</span>
                          <span className="text-[10px] font-mono">{rejectedPlans.length} filtered</span>
                        </div>

                        {rejectedPlans.length === 0 ? (
                          <div className="p-3 bg-harborTeal/10 border border-harborTeal/20 rounded-xl text-xs text-harborTeal-dark font-medium">
                            ✓ All evaluated options satisfied your requirements.
                          </div>
                        ) : (
                          <div className="space-y-2 text-xs">
                            {rejectedPlans.map((rej, i) => (
                              <div key={i} className="p-3 bg-sunsetCoral/10 border border-sunsetCoral/20 rounded-xl space-y-0.5">
                                <div className="font-bold text-sunsetCoral">{rej.title}</div>
                                <div className="text-[11px] text-sunsetCoral-dark">{rej.hard_violation}</div>
                                <div className="text-[10px] text-twilight-muted">{rej.reason}</div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* WHAT-IF REPLANNER */}
                      <div className="bg-white rounded-3xl p-6 border border-mist-border shadow-sm space-y-3">
                        <div className="text-xs font-extrabold uppercase tracking-wider text-twilight-muted">Quick Replan Options</div>
                        <div className="grid grid-cols-2 gap-2 text-xs">
                          <button onClick={() => executeReplan(mission.max_budget ? mission.max_budget * 0.8 : 35000, mission.deadline_minutes, mission.arrival_deadline, "cheapest")} className="p-3 bg-mist-canvas border border-mist-border rounded-xl text-left hover:border-sunsetCoral transition">
                            <div className="font-bold text-twilight-950">Budget -20%</div>
                            <div className="text-[10px] text-twilight-muted">Re-prune luxury stays</div>
                          </button>
                          <button onClick={() => executeReplan(mission.max_budget, 480, "08:00 AM", "fastest")} className="p-3 bg-mist-canvas border border-mist-border rounded-xl text-left hover:border-sunsetCoral transition">
                            <div className="font-bold text-twilight-950">Reach by 8 AM</div>
                            <div className="text-[10px] text-twilight-muted">Strict early arrival</div>
                          </button>
                        </div>
                      </div>

                    </div>

                  </div>
                </div>
              </div>
            )}

            {/* VIEW 5: TERMINAL CONFIRMED STATE */}
            {step === 'confirmed' && mission && activePlan && (
              <div className="min-h-[calc(100vh-140px)] flex items-center justify-center py-16 px-4 bg-mist-canvas">
                <div className="bg-white max-w-lg w-full rounded-3xl p-8 border border-mist-border shadow-2xl text-center space-y-6">
                  <div className="w-16 h-16 mx-auto rounded-full bg-harborTeal/15 text-harborTeal-dark border border-harborTeal/30 flex items-center justify-center text-3xl font-bold">
                    ✓
                  </div>
                  <div>
                    <h2 className="text-2xl font-black text-twilight-950">YOUR TRIP IS CONFIRMED</h2>
                    <p className="text-xs text-twilight-muted mt-1">Trip plan confirmed. Booking handoff prepared.</p>
                  </div>

                  <div className="bg-mist-canvas p-5 rounded-2xl border border-mist-border text-left space-y-2 text-xs">
                    <div className="flex justify-between font-bold text-twilight-950">
                      <span>Destination:</span>
                      <span className="text-harborTeal-dark">{mission.origin} → {activePlan.final_destination}</span>
                    </div>
                    <div className="flex justify-between text-twilight-muted">
                      <span>Dates:</span>
                      <span>{mission.dates.display_label}</span>
                    </div>
                    <div className="flex justify-between text-twilight-muted">
                      <span>Travelers:</span>
                      <span>{mission.travelers.total_count} persons ({mission.rooms_count} rooms)</span>
                    </div>
                    <div className="pt-2 border-t border-mist-border flex justify-between font-extrabold text-sm text-twilight-950">
                      <span>Total Authorized:</span>
                      <span className="text-sunsetCoral font-mono">₹{activePlan.total_cost.toLocaleString()}</span>
                    </div>
                  </div>

                  <div className="flex gap-3">
                    <button onClick={() => setStep('dashboard')} className="flex-1 py-3 rounded-xl border border-mist-border text-xs font-bold hover:bg-mist-canvas transition">
                      View Itinerary
                    </button>
                    <button onClick={handleNewTrip} className="flex-1 py-3 rounded-xl bg-sunsetCoral hover:bg-sunsetCoral-hover text-white text-xs font-bold transition shadow-md">
                      + Start New Trip
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* CONFIRMATION REVIEW MODAL */}
          {showConfirmModal && activePlan && (
            <div className="fixed inset-0 z-50 bg-twilight-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white max-w-md w-full rounded-3xl p-7 border border-mist-border shadow-2xl space-y-4">
                <div className="text-xs font-extrabold uppercase tracking-wider text-sunsetCoral">Review & Authorize</div>
                <h3 className="text-xl font-black text-twilight-950">Approve Complete Plan?</h3>
                <p className="text-xs text-twilight-muted">
                  Confirming prepares unified handoff payloads for {mission.origin} → {activePlan.final_destination}. No charges will occur in demo mode.
                </p>
                <div className="p-3 bg-mist-canvas rounded-xl font-mono text-sm font-bold flex justify-between">
                  <span>Total Cost:</span>
                  <span className="text-sunsetCoral">₹{activePlan.total_cost.toLocaleString()}</span>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowConfirmModal(false)} className="px-4 py-2 text-xs font-semibold text-twilight-muted">Cancel</button>
                  <button onClick={handleConfirmAction} className="px-6 py-2.5 rounded-xl bg-sunsetCoral text-white text-xs font-bold">
                    Authorize Plan
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-white/10 bg-twilight-950 py-6 text-xs text-mist text-center">
            TRAVALOS • Destination-Agnostic Agentic Travel Engine • Verified Benchmark Simulation
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
